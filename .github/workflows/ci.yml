name: CI/CD Pipeline

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    name: Lint e Testes
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
    
    - name: 🐍 Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: 📦 Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: 📥 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pytest
        
    - name: 🧹 Lint com flake8
      run: |
        # Para erros que param o build
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Para todos os avisos
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: 🔍 Verificar sintaxe Python
      run: |
        python -m py_compile app.py
        find src -name "*.py" -exec python -m py_compile {} \;
        
    - name: 🧪 Executar testes
      run: |
        if [ -f "tests/test_*.py" ]; then
          pytest tests/ -v
        else
          echo "Nenhum teste encontrado - OK para projeto inicial"
        fi
        
    - name: 📊 Verificar imports
      run: |
        python -c "
        try:
            import streamlit
            import pandas  
            import plotly
            print('✅ Todas as dependências principais estão OK')
        except ImportError as e:
            print(f'❌ Erro de import: {e}')
            exit(1)
        "

  security-check:
    name: Verificação de Segurança
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout código
      uses: actions/checkout@v4
      
    - name: 🐍 Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: 🔒 Verificar vulnerabilidades
      run: |
        pip install safety
        pip install -r requirements.txt
        safety check
        
    - name: 🕵️ Verificar secrets no código
      run: |
        # Verifica se não há senhas hardcoded
        if grep -r "password.*=" . --include="*.py" --exclude-dir=".git"; then
          echo "❌ Possíveis senhas hardcoded encontradas!"
          exit 1
        fi
        if grep -r "DASH_SENHA.*=" . --include="*.py" --exclude-dir=".git" | grep -v "os.environ"; then
          echo "❌ Senha hardcoded encontrada!"
          exit 1  
        fi
        echo "✅ Nenhuma senha hardcoded encontrada"